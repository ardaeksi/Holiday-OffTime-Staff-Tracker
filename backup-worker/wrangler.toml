name = "holiday-tracker-backup"
main = "index.js"
compatibility_date = "2024-01-01"

# The HTTP endpoints (/restore can overwrite live data) must NOT be reachable
# from the public internet. Only the daily cron needs to run, and cron triggers
# don't need a public URL. See README → "Daily Backups" for manual restore.
workers_dev = false
preview_urls = false

[triggers]
crons = ["0 8 * * *"]

# Must point at the SAME KV namespace already bound to the main Pages project
# as "TRACKER_KV". Find its ID in Cloudflare dashboard → Workers & Pages → KV,
# or by running: wrangler kv namespace list
[[kv_namespaces]]
binding = "TRACKER_KV"
id = "03d50de4f9fe4223bb39b97feb4e06a8"
