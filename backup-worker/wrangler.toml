name = "holiday-tracker-backup"
main = "index.js"
compatibility_date = "2024-01-01"


[triggers]
crons = ["0 8 * * *"]

# Must point at the SAME KV namespace already bound to the main Pages project
# as "TRACKER_KV". Find its ID in Cloudflare dashboard → Workers & Pages → KV,
# or by running: wrangler kv namespace list
[[kv_namespaces]]
binding = "TRACKER_KV"
id = "03d50de4f9fe4223bb39b97feb4e06a8"
